version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"

  # NOTE: github-actions ecosystem is intentionally disabled.
  # All GitHub Actions are pinned to commit SHAs for supply-chain
  # hardening. Dependabot cannot manage SHA pins effectively; manual
  # updates are required when bumping action versions.
  # - package-ecosystem: "github-actions"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
