name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

      - name: Install protoc (for clippy on suture-hub)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --exclude suture-fuzz --exclude suture-py --exclude suture-e2e --exclude suture-bench --exclude suture-vfs --exclude suture-lsp --exclude suture-daemon --exclude suture-wasm-plugin -- -D warnings

      - name: Check for hardcoded secrets (recent commits)
        run: |
          # Scan last 200 commits for potential secrets (pattern-based)
          if git log -n 200 -p | grep -Pi '(password|secret|token|api[_-]?key)\s*[:=]\s*["\x27][^"[:space:]\x27]{8,}["\x27]'; then
            echo "::warning::Potential hardcoded secrets detected in recent git history"
          else
            echo "No hardcoded secrets detected in recent commits"
          fi

      - name: Generate SBOM
        run: |
          cargo tree --depth 1 > sbom.txt
          cat sbom.txt

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.txt
          retention-days: 90
