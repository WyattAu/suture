name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Fallback: manually trigger after tag push

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: suture

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build release binaries for all platforms ──────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: suture
            asset_suffix: x86_64-linux
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: suture
            asset_suffix: aarch64-macos
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: suture
            asset_suffix: x86_64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: suture.exe
            asset_suffix: x86_64-windows

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      # protoc 是 prost/tonic build 脚本的硬依赖(suture-protocol gRPC),
      # 缺了它 Windows/macOS 的 cargo build 会失败(只有 Linux 装会漏掉这两个平台).
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 显式安装交叉编译 target:dtolnay/rust-toolchain 的 targets 输入
      # 在存在 rust-toolchain.toml 时可能不生效,导致 arm64 runner 上
      # x86_64-apple-darwin 交叉编译报 E0463(can't find crate for core).
      - name: Add cross-compile target (explicit)
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p suture-cli

      - name: Verify binary
        run: ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} version
        shell: bash

      - name: Strip binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../suture-${{ matrix.asset_suffix }}.tar.gz ${{ matrix.artifact_name }}
          cd ../../../
          sha256sum suture-${{ matrix.asset_suffix }}.tar.gz > suture-${{ matrix.asset_suffix }}.tar.gz.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path suture.exe -DestinationPath ../../../suture-${{ matrix.asset_suffix }}.zip
          cd ../../../
          (Get-FileHash -Path "suture-${{ matrix.asset_suffix }}.zip" -Algorithm SHA256).Hash.ToLower() + "  suture-${{ matrix.asset_suffix }}.zip" | Out-File -Encoding ascii "suture-${{ matrix.asset_suffix }}.zip.sha256"

      - name: Sign artifact (Linux/macOS)
        if: env.GPG_PRIVATE_KEY != '' && runner.os != 'Windows'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --passphrase "${{ secrets.GPG_PASSPHRASE }}"
          gpg --batch --yes --passphrase "${{ secrets.GPG_PASSPHRASE }}" --armor --detach-sign suture-${{ matrix.asset_suffix }}.tar.gz
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign artifact (Windows)
        if: env.GPG_PRIVATE_KEY != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --passphrase "${{ secrets.GPG_PASSPHRASE }}"
          gpg --batch --yes --passphrase "${{ secrets.GPG_PASSPHRASE }}" --armor --detach-sign suture-${{ matrix.asset_suffix }}.zip
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: suture-${{ matrix.asset_suffix }}
          path: |
            suture-${{ matrix.asset_suffix }}.tar.gz
            suture-${{ matrix.asset_suffix }}.tar.gz.sha256
            suture-${{ matrix.asset_suffix }}.tar.gz.asc
            suture-${{ matrix.asset_suffix }}.zip
            suture-${{ matrix.asset_suffix }}.zip.sha256
            suture-${{ matrix.asset_suffix }}.zip.asc

  # ── Publish to crates.io ─────────────────────────────────────────
  publish-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build]  # Only publish after successful builds

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: publish

      # Verify everything builds and tests pass before publishing
      - name: Test workspace
        run: cargo test --workspace --exclude suture-fuzz --exclude suture-py --exclude suture-e2e --exclude suture-bench --exclude suture-vfs --exclude suture-lsp --exclude suture-daemon --exclude suture-wasm-plugin --exclude suture-driver-pdf --exclude suture-driver-image --exclude suture-driver-svg --exclude suture-driver-pptx

      # Publish crates in dependency order using the existing script
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            exit 0
          fi
          bash scripts/publish.sh --real

  # ── Publish npm package ──────────────────────────────────────────
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download Linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: suture-x86_64-linux
          path: /tmp/binaries

      - name: Update npm version from git tag
        working-directory: packages/suture-merge-driver
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version 2>/dev/null || true

      - name: Publish to npm
        working-directory: packages/suture-merge-driver
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN not set — skipping npm publish"
            exit 0
          fi
          npm publish --access public

  # ── Publish pip package ──────────────────────────────────────────
  publish-pip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        working-directory: packages/suture-merge-py
        run: python -m build

      - name: Publish to PyPI
        working-directory: packages/suture-merge-py
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::notice::PYPI_API_TOKEN not set — skipping PyPI publish"
            exit 0
          fi
          twine upload dist/* --skip-existing

  # ── Source tarball ────────────────────────────────────────────────
  source-tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Create source tarball
        run: |
          tar czf suture-src.tar.gz \
            --exclude='.git' \
            --exclude='target' \
            --exclude='.direnv' \
            --exclude='node_modules' \
            --exclude='desktop-app/node_modules' \
            --exclude='desktop-app/src-tauri/target' \
            --exclude='.cargo' \
            --warning=no-file-changed \
            --ignore-failed-read \
            . || true
          # Fallback: create tarball from known directories
          if [ ! -f suture-src.tar.gz ] || [ ! -s suture-src.tar.gz ]; then
            tar czf suture-src.tar.gz \
              --exclude='.git' \
              --exclude='target' \
              --exclude='.direnv' \
              --exclude='node_modules' \
              --exclude='desktop-app' \
              --exclude='.cargo' \
              crates packages scripts docs CHANGELOG.md VERSION.md README.md LICENSE Apache-2.0.md CONTRIBUTING.md .github
          fi
          ls -la suture-src.tar.gz

      - name: Upload source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: suture-source
          path: suture-src.tar.gz

  # ── Build and push Docker image to GHCR ──────────────────────────
  # Disabled on this fork (v5.3.1-action): no GHCR image publish needed.
  docker:
    runs-on: ubuntu-latest
    needs: [build]
    if: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub Release ────────────────────────────────────────
  release:
    needs: [build, publish-crates, publish-npm, publish-pip, source-tarball, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums manifest
        run: |
          echo "## Checksums" > CHECKSUMS.md
          echo "" >> CHECKSUMS.md
          echo "Verify artifacts with:" >> CHECKSUMS.md
          echo '```' >> CHECKSUMS.md
          for f in artifacts/*.sha256; do
            [ -f "$f" ] && cat "$f" >> CHECKSUMS.md
          done
          echo '```' >> CHECKSUMS.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          body_path: CHECKSUMS.md
