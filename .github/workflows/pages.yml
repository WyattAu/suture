name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@900f221
      - name: Build documentation
        run: bash docs/build.sh
      - name: Copy CNAME
        run: cp docs-site/CNAME docs/CNAME
      - uses: actions/configure-pages@983d773
      - uses: actions/upload-pages-artifact@56afc60
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@d6db901
