name: Performance

on:
  push:
    branches: [main]
    paths-ignore: [docs/**, '*.md', '*.txt']
  pull_request:
    branches: [main]
    paths-ignore: [docs/**, '*.md', '*.txt']

permissions:
  contents: read
  actions: write

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: perf
      - name: Run benchmarks
        run: cargo bench --package suture-bench -- --save-baseline main | tee bench-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bench-baseline
          path: target/criterion
          retention-days: 30

  compare:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: perf
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: bench-baseline
          path: target/criterion
      - name: Run benchmarks and compare
        run: |
          cargo bench --package suture-bench -- --baseline main 2>&1 | tee bench-results.txt || true
          if grep -q 'Performance has regression' bench-results.txt; then
            echo "::error::Performance regression detected (>10%)"
            grep 'Performance has regression' bench-results.txt
            exit 1
          fi
          echo "No performance regressions detected"
