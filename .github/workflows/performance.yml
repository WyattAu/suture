name: Performance

on:
  push:
    branches: [main]
    paths-ignore: [docs/**, '*.md', '*.txt']
  pull_request:
    branches: [main]
    paths-ignore: [docs/**, '*.md', '*.txt']

permissions:
  contents: read
  actions: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf
      - name: Run benchmarks
        run: cargo bench --package suture-bench -- --save-baseline main | tee bench-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: target/criterion
          retention-days: 30

  compare:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-baseline
          path: target/criterion
      - name: Run benchmarks and compare
        run: |
          cargo bench --package suture-bench -- --baseline main 2>&1 | tee bench-results.txt || true
          if grep -q 'Performance has regression' bench-results.txt; then
            echo "::error::Performance regression detected (>10%)"
            grep 'Performance has regression' bench-results.txt
            exit 1
          fi
          echo "No performance regressions detected"
